<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <title>До зарплати — Until Payday</title>
  <style>
    :root{color-scheme:light dark;--ink:#102a43;--muted:#526f8a;--line:#d9e2ec;--surface:#fff;--bg:#eaf2f6;--brand:#0f766e}
    @media (prefers-color-scheme:dark){:root{--ink:#e8eef4;--muted:#a8bccf;--line:#2b4a63;--surface:#14293c;--bg:#0d1b28;--brand:#5eead4}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
    main{width:min(100%,520px);background:var(--surface);border-radius:24px;padding:clamp(24px,6vw,40px);box-shadow:0 12px 40px rgba(16,42,67,.1);text-align:center}
    img{width:96px;height:96px;border-radius:22px;margin-bottom:16px}
    h1{font-size:clamp(26px,7vw,34px);letter-spacing:-.02em;margin:0 0 4px}
    h2{font-size:18px;font-weight:600;color:var(--muted);margin:0 0 20px}
    p{color:var(--muted);margin:0 0 12px}
    a{color:var(--brand);font-weight:600}
    nav{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
  </style>
</head>
<body>
  <main>
    <img src="../icons/app-icon-192.png" alt="">
    <h1>До зарплати</h1>
    <h2 lang="en">Until Payday</h2>
    <p>Скільки можна безпечно витрачати щодня до наступної зарплати. Працює офлайн, дані не залишають пристрій.</p>
    <p lang="en">How much you can safely spend each day until your next paycheck. Works offline; your data never leaves the device.</p>
    <nav>
      <a href="privacy/">Політика конфіденційності · Privacy Policy</a>
    </nav>
  </main>
</body>
</html>
